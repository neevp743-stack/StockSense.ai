<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a11" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  
  <!-- Neural Market Signal Grid Lines -->
  <path d="M 20,70 L 38,55 L 54,62 L 80,30" fill="none" stroke="url(#cyanGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M 20,70 L 38,55 L 54,62 L 80,30" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

  <!-- Candlestick Bar Overlay -->
  <line x1="38" y1="45" x2="38" y2="65" stroke="#10b981" stroke-width="2"/>
  <rect x="34" y="50" width="8" height="10" fill="#10b981" rx="1.5"/>

  <line x1="54" y1="52" x2="54" y2="70" stroke="#ef4444" stroke-width="2"/>
  <rect x="50" y="56" width="8" height="9" fill="#ef4444" rx="1.5"/>

  <line x1="80" y1="22" x2="80" y2="40" stroke="#10b981" stroke-width="2"/>
  <rect x="76" y="25" width="8" height="10" fill="#10b981" rx="1.5"/>

  <!-- Neural Nodes -->
  <circle cx="20" cy="70" r="4.5" fill="#00f2fe" filter="url(#glow)"/>
  <circle cx="38" cy="55" r="4" fill="#38bdf8"/>
  <circle cx="54" cy="62" r="4" fill="#a855f7"/>
  <circle cx="80" cy="30" r="5.5" fill="#10b981" filter="url(#glow)"/>
  <circle cx="80" cy="30" r="2.5" fill="#ffffff"/>
</svg>